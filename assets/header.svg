<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070f"/>
      <stop offset="55%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b6ff2e"/>
      <stop offset="100%" stop-color="#7CFF00"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="90%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#7CFF00" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#7CFF00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#glow1)"/>
  <rect width="1200" height="420" fill="url(#glow2)"/>
  <!-- pill -->
  <rect x="470" y="36" width="260" height="34" rx="17" fill="#0b1220" stroke="#2563eb" stroke-width="2"/>
  <text x="600" y="58" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="#93c5fd" font-weight="600">saisiri1207.github.io</text>
  <!-- dots -->
  <g fill="#60a5fa" opacity=".35">
    <circle cx="80" cy="60" r="2"/><circle cx="110" cy="90" r="1.5"/><circle cx="50" cy="110" r="1.5"/>
    <circle cx="140" cy="40" r="1"/><circle cx="170" cy="75" r="2"/>
    <circle cx="1080" cy="320" r="2"/><circle cx="1120" cy="350" r="1.5"/><circle cx="1050" cy="370" r="1.5"/>
  </g>
  <!-- curve accents -->
  <path d="M0,300 C200,220 400,380 600,300 S1000,200 1200,280" fill="none" stroke="#1d4ed8" stroke-width="2" opacity=".45"/>
  <path d="M0,340 C250,280 450,400 700,320 S1050,260 1200,340" fill="none" stroke="#7CFF00" stroke-width="1.5" opacity=".3"/>
  <!-- headline -->
  <text x="600" y="140" text-anchor="middle" font-family="Inter, Arial Black, sans-serif" font-size="42" font-weight="800" fill="#ffffff">SAI SIRI</text>
  <text x="600" y="188" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff">FINANCE &amp; BUSINESS ANALYTICS</text>
  <text x="600" y="230" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1">Financial Analyst  ·  FP&amp;A  ·  SQL · Power BI · Tableau</text>
  <!-- KPI cards -->
  <g>
    <rect x="120" y="270" width="280" height="100" rx="18" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="260" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#93c5fd" font-weight="700">$50M</text>
    <text x="260" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Expense base</text>
  </g>
  <g>
    <rect x="460" y="270" width="280" height="100" rx="18" fill="#0b1220" stroke="#7CFF00" stroke-width="2.5"/>
    <text x="600" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#b6ff2e" font-weight="700">5 → 3 DAYS</text>
    <text x="600" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Month end close</text>
  </g>
  <g>
    <rect x="800" y="270" width="280" height="100" rx="18" fill="#0b1220" stroke="#2563eb" stroke-width="2.5"/>
    <text x="940" y="310" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#93c5fd" font-weight="700">16 MODELS</text>
    <text x="940" y="340" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#ffffff" font-weight="600">Public on GitHub</text>
  </g>
</svg>
